name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PLAYWRIGHT_HTML_REPORT: "1"
      ISBN_LIBRARY_BACKEND_COVERAGE_XML: ${{ runner.temp }}/isbn-library-backend-coverage.xml
      ISBN_LIBRARY_BACKEND_TEST_RESULTS_DIR: ${{ runner.temp }}/isbn-library-backend-test-results
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go for Gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-test.txt
            infrastructure/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Install backend test dependencies
        run: pip install -r backend/requirements-test.txt

      - name: Install infrastructure dependencies
        run: pip install -r infrastructure/requirements.txt

      - name: Install Gitleaks
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run quality gates
        run: npm run quality:prepush

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/isbn-library-backend-coverage.xml
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
